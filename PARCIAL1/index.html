<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAFE TRIGAL</title>
    <link rel="stylesheet" href="/PARCIAL1/styles.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="img/logo.webp" alt="Logo de la empresa">
        </div>
        <div class="titulo">
            <h1>CAFE TRIGAL</h1>
            <p>Bienvenido a nuestro café</p>
        </div>
        <div class="redes">
            <a href="#"><img src="/PARCIAL1/img/facebook.webp" alt="Facebook"></a>
            <a href="#"><img src="/PARCIAL1/img/tiktok.webp" alt="TikTok"></a>
            <a href="#"><img src="/PARCIAL1/img/instagram.webp" alt="Instagram"></a>
        </div>

    </header>
    <nav class="menu">
        <a href="#">INICIO</a>
        <a href="#cafe">SECCIÓN DE PRODUCTOS</a>
        <a href="#contacto">CONTACTOS</a>
    </nav>
    <main>
        <section class="cafe" id="cafe">
            <h2>Nuestros Cafés</h2>
            <ul>
                <li>Café Americano - Bs 12</li>
                <li>Capuchino - Bs 18</li>
                <li>Submarino - Bs 15</li>
            </ul>
        </section>
        <section class="contacto" id="contacto">
            <section class="seccion-formulario">
                <form id="formulario-contacto">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>

                    <label for="correo">Correo:</label>
                    <input type="email" id="correo" name="correo" required>

                    <label for="mensaje">Mensaje:</label>
                    <input type="text" id="mensaje" name="mensaje" required>
                </form>

                <button id="btn-confirmar">Confirmar pedido</button>
                <p id="mensaje-respuesta" class="oculto"></p>
        
            </section>
        </section>
    </main>
    <footer>
        <p>&copy; Parcial1 - Claudio Jesus Flores - 3 de agosto de 2026 </p>
    </footer>
    <script src="/PARCIAL1/script.js"></script>
</body>

</html>
