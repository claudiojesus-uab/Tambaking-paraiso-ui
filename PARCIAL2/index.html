<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HELADERIA DOÑA NIEVE</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Heladeria doña Nieve</h1>
        <p>Los mejores helados del barrio con sabores caseros se hacen entregas a domicilio </p>
    </header>
    <section>
        <form id="form-helados" novalidate method="" action="">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="correo">Correo electronico</label>
            <input type="text" id="correo" name="correo" required>

            <label for="sabores">Que sabor quieres?</label>
            <textarea name="sabores" id="sabores"></textarea>

            <button type="submit">Enviar Pedido</button>
            <p id="aviso-helados" class="aviso"></p>
        </form>

    </section>
    <footer>
        <p>&copy; Parcial 2 - Claudio Jesus Flores - 11 de agosto de 2026</p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
